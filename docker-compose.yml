  #   container_name: leadforge-scheduler
  #   restart: unless-stopped
  #   env_file: [.env]
  #   volumes:
  #     - leadforge-logs:/app/logs
  #     - leadforge-data:/app/data
  #     - ./campaign_configs:/app/campaign_configs
  #   networks: [leadforge-net]
  #   environment:
  #     - PYTHONUNBUFFERED=1
